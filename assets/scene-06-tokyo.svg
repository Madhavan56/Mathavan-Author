<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="tk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d13"/>
      <stop offset="0.55" stop-color="#101621"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="tkwet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1520"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="neon1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d3283a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d3283a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neon2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb8c9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3fb8c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#tk)"/>
  <!-- dense Tokyo building wall -->
  <g fill="#0b0e15">
    <rect x="0" y="120" width="260" height="560"/>
    <rect x="260" y="200" width="200" height="480"/>
    <rect x="460" y="90" width="240" height="590"/>
    <rect x="700" y="180" width="180" height="500"/>
    <rect x="880" y="60" width="260" height="620"/>
    <rect x="1140" y="170" width="220" height="510"/>
    <rect x="1360" y="110" width="240" height="570"/>
  </g>
  <!-- vertical signage, muted -->
  <g>
    <rect x="510" y="150" width="34" height="180" rx="4" fill="#8e2030" opacity="0.85"/>
    <rect x="554" y="170" width="26" height="140" rx="4" fill="#20565e" opacity="0.8"/>
    <rect x="920" y="120" width="36" height="220" rx="4" fill="#8e2030" opacity="0.75"/>
    <rect x="1180" y="220" width="30" height="150" rx="4" fill="#20565e" opacity="0.7"/>
    <rect x="1420" y="160" width="32" height="190" rx="4" fill="#7d6a3a" opacity="0.6"/>
  </g>
  <ellipse cx="527" cy="240" rx="150" ry="200" fill="url(#neon1)" opacity="0.5"/>
  <ellipse cx="967" cy="230" rx="170" ry="220" fill="url(#neon2)" opacity="0.45"/>
  <ellipse cx="527" cy="240" rx="150" ry="200" fill="url(#neon1)" opacity="0.4" transform="translate(440 0)"/>
  <!-- scattered windows -->
  <g fill="#43506a" opacity="0.5">
    <rect x="30" y="180" width="20" height="30"/><rect x="80" y="240" width="20" height="30"/>
    <rect x="180" y="200" width="20" height="30"/><rect x="300" y="260" width="18" height="26"/>
    <rect x="740" y="240" width="18" height="26"/><rect x="950" y="380" width="18" height="26"/>
    <rect x="1200" y="300" width="18" height="26"/><rect x="1470" y="240" width="18" height="26"/>
  </g>
  <!-- street level -->
  <rect y="680" width="1600" height="220" fill="url(#tkwet)"/>
  <!-- neon reflections smeared on wet asphalt -->
  <g opacity="0.4">
    <path d="M500 700 L554 700 L570 880 L480 880 Z" fill="#d3283a" opacity="0.35"/>
    <path d="M940 700 L990 700 L1000 880 L925 880 Z" fill="#3fb8c9" opacity="0.28"/>
    <path d="M1190 700 L1225 700 L1235 860 L1178 860 Z" fill="#3fb8c9" opacity="0.2"/>
  </g>
  <!-- Lucy walking through, mid-stride -->
  <g fill="#04050a">
    <circle cx="760" cy="520" r="17"/>
    <path d="M742 540 Q760 533 778 540 L785 622 L735 622 Z"/>
    <rect x="740" y="618" width="12" height="66" transform="rotate(-8 746 618)"/>
    <rect x="762" y="618" width="12" height="66" transform="rotate(10 768 618)"/>
  </g>
  <ellipse cx="760" cy="700" rx="46" ry="9" fill="#0a0d15"/>
  <!-- the contact waiting far ahead under an awning -->
  <g fill="#05060b">
    <circle cx="1330" cy="560" r="13"/>
    <path d="M1314 576 Q1330 570 1346 576 L1352 668 L1308 668 Z"/>
  </g>
  <rect x="1280" y="500" width="120" height="14" fill="#0a0d15"/>
  <ellipse cx="1336" cy="530" rx="90" ry="22" fill="#d3283a" opacity="0.1"/>
  <!-- subtle blade hint at her hip -->
  <line x1="775" y1="580" x2="790" y2="612" stroke="#8b95a8" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <!-- rain over the city -->
  <g stroke="#9fb4d8" stroke-width="1.3" opacity="0.14">
    <line x1="200" y1="100" x2="172" y2="200"/>
    <line x1="420" y1="180" x2="392" y2="290"/>
    <line x1="640" y1="90" x2="612" y2="190"/>
    <line x1="860" y1="200" x2="832" y2="310"/>
    <line x1="1060" y1="120" x2="1032" y2="230"/>
    <line x1="1260" y1="80" x2="1232" y2="190"/>
    <line x1="1480" y1="200" x2="1452" y2="310"/>
    <line x1="330" y1="420" x2="302" y2="520"/>
    <line x1="1010" y1="450" x2="982" y2="550"/>
    <line x1="1390" y1="420" x2="1362" y2="520"/>
  </g>
  <rect width="1600" height="900" fill="#0c0b0a" opacity="0.2"/>
</svg>
