<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b10"/>
      <stop offset="0.55" stop-color="#12141c"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4152" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a4152" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="back" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#c9d6e8" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#8fa3bf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8fa3bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#fin)"/>
  <!-- industrial rooftop skyline, far background -->
  <g fill="#080a0e">
    <rect x="0" y="380" width="300" height="320"/>
    <rect x="340" y="430" width="220" height="270"/>
    <rect x="1300" y="400" width="300" height="300"/>
    <rect x="1080" y="460" width="180" height="240"/>
    <rect x="600" y="480" width="140" height="220"/>
  </g>
  <!-- antennas and vents -->
  <g stroke="#080a0e" stroke-width="8">
    <line x1="420" y1="430" x2="420" y2="330"/>
    <line x1="1400" y1="400" x2="1400" y2="290"/>
  </g>
  <!-- the big backlight between them -->
  <ellipse cx="800" cy="430" rx="520" ry="300" fill="url(#back)"/>
  <!-- ground: wet rooftop, faint reflections -->
  <rect y="700" width="1600" height="200" fill="#07080b"/>
  <ellipse cx="800" cy="730" rx="480" ry="30" fill="#c9d6e8" opacity="0.06"/>
  <!-- Lucy: en garde, backlit rim -->
  <g fill="#020304">
    <circle cx="690" cy="470" r="19"/>
    <path d="M666 492 Q690 484 714 492 L722 600 L658 600 Z"/>
    <rect x="668" y="596" width="15" height="88" transform="rotate(-10 675 596)"/>
    <rect x="700" y="596" width="15" height="88" transform="rotate(12 707 596)"/>
    <path d="M712 504 L768 480 L796 490" stroke="#020304" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- rim light on her back -->
  <path d="M666 492 Q690 484 714 492" stroke="#c9d6e8" stroke-width="2.4" fill="none" opacity="0.7"/>
  <!-- her blade raised between them -->
  <line x1="796" y1="490" x2="880" y2="410" stroke="#dfe8f5" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  <ellipse cx="838" cy="450" rx="30" ry="8" fill="#dfe8f5" opacity="0.3" transform="rotate(-42 838 450)"/>
  <!-- the final threat: taller silhouette, weapon lowered -->
  <g fill="#020304">
    <circle cx="930" cy="430" r="22"/>
    <path d="M902 456 Q930 447 958 456 L966 590 L894 590 Z"/>
    <rect x="902" y="586" width="17" height="96"/>
    <rect x="946" y="586" width="17" height="96"/>
    <path d="M904 470 L852 500 L838 540" stroke="#020304" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- his rim light -->
  <path d="M958 456 Q930 447 902 456" stroke="#c9d6e8" stroke-width="2.2" fill="none" opacity="0.5"/>
  <!-- his blade, lowered but glinting -->
  <line x1="838" y1="540" x2="812" y2="620" stroke="#aebcd2" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- rain sweeping between them -->
  <g stroke="#aebcd2" stroke-width="1.5" opacity="0.18">
    <line x1="500" y1="140" x2="460" y2="280"/>
    <line x1="660" y1="200" x2="620" y2="340"/>
    <line x1="820" y1="120" x2="780" y2="260"/>
    <line x1="980" y1="220" x2="940" y2="360"/>
    <line x1="1140" y1="150" x2="1100" y2="290"/>
    <line x1="1330" y1="240" x2="1290" y2="380"/>
    <line x1="560" y1="480" x2="520" y2="620"/>
    <line x1="1040" y1="470" x2="1000" y2="610"/>
    <line x1="1240" y1="520" x2="1200" y2="660"/>
  </g>
  <rect width="1600" height="900" fill="url(#mist)"/>
  <rect width="1600" height="900" fill="#0c0b0a" opacity="0.2"/>
</svg>
