<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1210"/>
      <stop offset="0.55" stop-color="#241a16"/>
      <stop offset="1" stop-color="#120d0b"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.72" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ffb75e" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#c97b3a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c97b3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191310"/>
      <stop offset="1" stop-color="#0d0a08"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- distant skyline -->
  <g fill="#0f0b09">
    <rect x="0" y="240" width="300" height="330"/>
    <rect x="340" y="300" width="180" height="270"/>
    <rect x="560" y="210" width="150" height="360"/>
    <rect x="1230" y="260" width="200" height="310"/>
    <rect x="1470" y="320" width="130" height="250"/>
  </g>
  <!-- terraced houses, Notting Hill -->
  <g>
    <rect x="380" y="330" width="820" height="270" fill="#1c1512"/>
    <g fill="#221a15">
      <rect x="390" y="340" width="130" height="250"/>
      <rect x="530" y="340" width="130" height="250"/>
      <rect x="670" y="340" width="130" height="250"/>
      <rect x="810" y="340" width="130" height="250"/>
      <rect x="950" y="340" width="130" height="250"/>
      <rect x="1090" y="340" width="100" height="250"/>
    </g>
    <!-- warm lit windows on the family home -->
    <g fill="#ffc069">
      <rect x="700" y="370" width="38" height="56" rx="2" opacity="0.9"/>
      <rect x="760" y="370" width="38" height="56" rx="2" opacity="0.75"/>
      <rect x="700" y="460" width="38" height="56" rx="2" opacity="0.8"/>
      <rect x="840" y="370" width="38" height="56" rx="2" opacity="0.4"/>
    </g>
    <!-- dark windows -->
    <g fill="#0e0a08">
      <rect x="410" y="370" width="34" height="52" rx="2"/>
      <rect x="470" y="370" width="34" height="52" rx="2"/>
      <rect x="550" y="370" width="34" height="52" rx="2"/>
      <rect x="610" y="370" width="34" height="52" rx="2"/>
      <rect x="550" y="460" width="34" height="52" rx="2"/>
      <rect x="970" y="370" width="34" height="52" rx="2"/>
      <rect x="1030" y="370" width="34" height="52" rx="2"/>
      <rect x="970" y="460" width="34" height="52" rx="2"/>
    </g>
    <!-- doors -->
    <g fill="#0d0908">
      <rect x="484" y="520" width="30" height="70" rx="2"/>
      <rect x="764" y="520" width="30" height="70" rx="2"/>
      <rect x="904" y="520" width="30" height="70" rx="2"/>
    </g>
  </g>
  <!-- street lamp -->
  <rect x="240" y="430" width="6" height="180" fill="#0b0908"/>
  <ellipse cx="243" cy="424" rx="26" ry="12" fill="#ffd9a0" opacity="0.14"/>
  <circle cx="243" cy="426" r="7" fill="#ffca7a" opacity="0.85"/>
  <!-- road -->
  <rect y="600" width="1600" height="300" fill="url(#road)"/>
  <ellipse cx="243" cy="620" rx="130" ry="22" fill="#ffca7a" opacity="0.08"/>
  <!-- moving truck silhouette -->
  <g fill="#0a0807">
    <rect x="1050" y="520" width="150" height="90" rx="6"/>
    <rect x="1190" y="545" width="70" height="65" rx="6"/>
    <circle cx="1090" cy="618" r="17"/>
    <circle cx="1215" cy="618" r="17"/>
  </g>
  <rect x="1062" y="532" width="46" height="30" rx="3" fill="#ffb75e" opacity="0.12"/>
  <!-- family silhouettes arriving -->
  <g fill="#070505">
    <!-- father -->
    <circle cx="475" cy="560" r="12"/>
    <path d="M462 575 Q475 570 488 575 L492 622 L458 622 Z"/>
    <rect x="462" y="618" width="11" height="30"/>
    <rect x="477" y="618" width="11" height="30"/>
    <!-- mother (Lucy) looking up at windows -->
    <circle cx="530" cy="565" r="11"/>
    <path d="M519 578 Q530 573 541 578 L545 622 L515 622 Z"/>
    <rect x="518" y="618" width="10" height="30"/>
    <rect x="531" y="618" width="10" height="30"/>
    <!-- child holding hand -->
    <circle cx="506" cy="592" r="8"/>
    <path d="M499 601 Q506 598 513 601 L516 626 L496 626 Z"/>
  </g>
  <!-- her gaze toward the lit upper window -->
  <line x1="534" y1="560" x2="716" y2="392" stroke="#ffc069" stroke-opacity="0.14" stroke-width="2" stroke-dasharray="3 9"/>
  <!-- autumn leaves drifting -->
  <g fill="#8a5a2e" opacity="0.5">
    <ellipse cx="330" cy="500" rx="5" ry="2.4" transform="rotate(24 330 500)"/>
    <ellipse cx="410" cy="560" rx="5" ry="2.4" transform="rotate(-18 410 560)"/>
    <ellipse cx="900" cy="640" rx="5" ry="2.4" transform="rotate(40 900 640)"/>
    <ellipse cx="1340" cy="520" rx="5" ry="2.4" transform="rotate(-30 1340 520)"/>
    <ellipse cx="620" cy="650" rx="5" ry="2.4" transform="rotate(12 620 650)"/>
  </g>
  <rect width="1600" height="900" fill="url(#warm)"/>
  <rect width="1600" height="900" fill="#0c0b0a" opacity="0.18"/>
</svg>
