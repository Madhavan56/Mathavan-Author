<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="0.55" stop-color="#17161a"/>
      <stop offset="1" stop-color="#0a090b"/>
    </linearGradient>
    <radialGradient id="plat" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#d8cdb4" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#8a8272" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#8a8272" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#tunnel)"/>
  <!-- arched tunnel ceiling -->
  <path d="M0 640 L0 300 Q400 60 800 60 Q1200 60 1600 300 L1600 640 Z" fill="#0d0d10"/>
  <g stroke="#211f22" stroke-width="8" fill="none" opacity="0.8">
    <path d="M80 640 Q420 130 800 130 Q1180 130 1520 640"/>
    <path d="M160 640 Q460 190 800 190 Q1140 190 1440 640"/>
  </g>
  <!-- tiled wall -->
  <rect y="640" width="1600" height="260" fill="#121115"/>
  <g stroke="#1c1a1e" stroke-width="2">
    <line x1="0" y1="680" x2="1600" y2="680"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="0" y1="760" x2="1600" y2="760"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="100" y1="640" x2="100" y2="900"/>
    <line x1="300" y1="640" x2="300" y2="900"/>
    <line x1="500" y1="640" x2="500" y2="900"/>
    <line x1="700" y1="640" x2="700" y2="900"/>
    <line x1="900" y1="640" x2="900" y2="900"/>
    <line x1="1100" y1="640" x2="1100" y2="900"/>
    <line x1="1300" y1="640" x2="1300" y2="900"/>
    <line x1="1500" y1="640" x2="1500" y2="900"/>
  </g>
  <!-- platform lamps -->
  <g>
    <rect x="360" y="240" width="5" height="120" fill="#141317"/>
    <circle cx="362" cy="232" r="10" fill="#e8dcbe" opacity="0.9"/>
    <ellipse cx="362" cy="360" rx="110" ry="30" fill="#d8cdb4" opacity="0.08"/>
    <rect x="1230" y="240" width="5" height="120" fill="#141317"/>
    <circle cx="1232" cy="232" r="10" fill="#e8dcbe" opacity="0.9"/>
    <ellipse cx="1232" cy="360" rx="110" ry="30" fill="#d8cdb4" opacity="0.08"/>
  </g>
  <!-- track gap -->
  <rect y="820" width="1600" height="80" fill="#060506"/>
  <!-- blurred crowd mid-ground -->
  <g fill="#0b0a0c" opacity="0.85">
    <circle cx="560" cy="520" r="17"/><path d="M538 540 Q560 533 582 540 L590 640 L530 640 Z"/>
    <circle cx="640" cy="530" r="15"/><path d="M620 548 Q640 542 660 548 L667 640 L613 640 Z"/>
    <circle cx="960" cy="525" r="16"/><path d="M939 544 Q960 537 981 544 L988 640 L932 640 Z"/>
    <circle cx="1040" cy="535" r="14"/><path d="M1021 552 Q1040 546 1059 552 L1065 640 L1015 640 Z"/>
  </g>
  <!-- Lucy observing, side profile in foreground -->
  <g fill="#050405">
    <circle cx="330" cy="500" r="19"/>
    <path d="M306 522 Q330 514 354 522 L362 650 L298 650 Z"/>
    <rect x="308" y="646" width="15" height="70"/>
    <rect x="336" y="646" width="15" height="70"/>
  </g>
  <!-- the mysterious man: half-dissolved into the crowd -->
  <g fill="#08070a">
    <circle cx="836" cy="508" r="15"/>
    <path d="M816 526 Q836 519 856 526 L863 630 L809 630 Z"/>
    <!-- trailing dissolve -->
    <path d="M858 530 Q920 540 986 560 L980 578 Q918 560 860 552 Z" opacity="0.5"/>
  </g>
  <!-- his long shadow toward Lucy -->
  <path d="M812 636 L560 700 L560 676 L816 624 Z" fill="#060507" opacity="0.6"/>
  <!-- motion smear where he vanishes -->
  <g stroke="#3a373c" stroke-width="3" opacity="0.35" stroke-linecap="round">
    <line x1="872" y1="500" x2="916" y2="494"/>
    <line x1="876" y1="522" x2="930" y2="518"/>
    <line x1="872" y1="544" x2="912" y2="544"/>
  </g>
  <rect width="1600" height="900" fill="url(#plat)"/>
  <rect width="1600" height="900" fill="#0c0b0a" opacity="0.2"/>
</svg>
