<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120b08"/>
      <stop offset="0.5" stop-color="#1d100a"/>
      <stop offset="1" stop-color="#0a0605"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#ff8c3a" stop-opacity="0.65"/>
      <stop offset="0.35" stop-color="#d1491f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d1491f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2320" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a2320" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ember)"/>
  <!-- the house, dark against the fire glow -->
  <g fill="#0b0705">
    <rect x="480" y="300" width="640" height="330"/>
    <path d="M450 310 L800 160 L1150 310 Z"/>
    <rect x="760" y="180" width="80" height="90"/>
  </g>
  <!-- windows burning from within -->
  <g fill="#ff9d4d">
    <rect x="540" y="380" width="70" height="110" rx="3" opacity="0.95"/>
    <rect x="650" y="380" width="70" height="110" rx="3" opacity="0.85"/>
    <rect x="880" y="380" width="70" height="110" rx="3" opacity="0.8"/>
    <rect x="990" y="380" width="70" height="110" rx="3" opacity="0.6"/>
    <rect x="540" y="530" width="70" height="80" rx="3" opacity="0.7"/>
    <rect x="990" y="530" width="70" height="80" rx="3" opacity="0.45"/>
  </g>
  <rect x="770" y="530" width="60" height="100" rx="3" fill="#3a1a0d"/>
  <!-- fire glow spilling onto the street -->
  <rect y="630" width="1600" height="270" fill="#160c07"/>
  <rect y="630" width="1600" height="270" fill="url(#fire)" opacity="0.6"/>
  <ellipse cx="800" cy="680" rx="560" ry="90" fill="#ff8c3a" opacity="0.1"/>
  <!-- smoke drifting from the roof -->
  <g fill="#241a14" opacity="0.8">
    <ellipse cx="820" cy="150" rx="180" ry="42"/>
    <ellipse cx="960" cy="110" rx="220" ry="50"/>
    <ellipse cx="1130" cy="80" rx="260" ry="56"/>
  </g>
  <rect width="1600" height="900" fill="url(#smoke)"/>
  <!-- Lucy, small against the house, back view -->
  <g fill="#040302">
    <circle cx="330" cy="520" r="17"/>
    <path d="M312 540 Q330 533 348 540 L355 622 L305 622 Z"/>
    <rect x="313" y="618" width="13" height="58"/>
    <rect x="333" y="618" width="13" height="58"/>
  </g>
  <!-- her long shadow cast by the firelight -->
  <path d="M348 676 L700 760 L700 742 L352 664 Z" fill="#080402" opacity="0.7"/>
  <!-- embers rising -->
  <g fill="#ffb066">
    <circle cx="700" cy="240" r="3" opacity="0.8"/>
    <circle cx="760" cy="190" r="2.4" opacity="0.7"/>
    <circle cx="880" cy="210" r="2.8" opacity="0.75"/>
    <circle cx="950" cy="160" r="2.2" opacity="0.6"/>
    <circle cx="1050" cy="230" r="3" opacity="0.65"/>
    <circle cx="620" cy="300" r="2.2" opacity="0.5"/>
  </g>
  <rect width="1600" height="900" fill="#0c0b0a" opacity="0.16"/>
</svg>
