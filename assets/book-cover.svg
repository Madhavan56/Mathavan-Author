<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="THE LAST BLADE book cover by Mathavan Uma Mageshwari">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15110d"/>
      <stop offset="0.5" stop-color="#0d0b09"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.78" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#8f1a26" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#5c111b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#7e1620" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#3d0d14" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d17" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0908" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede0"/>
      <stop offset="0.42" stop-color="#b9ad97"/>
      <stop offset="0.55" stop-color="#6e6553"/>
      <stop offset="0.8" stop-color="#a99d85"/>
      <stop offset="1" stop-color="#2e2a22"/>
    </linearGradient>
    <linearGradient id="hiltLeather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e1019"/>
      <stop offset="0.5" stop-color="#8f1a26"/>
      <stop offset="1" stop-color="#4a0d14"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#moonGlow)"/>
  <rect width="600" height="900" fill="url(#floorGlow)"/>

  <!-- Moon -->
  <circle cx="470" cy="170" r="64" fill="#d8cbb6" opacity="0.13"/>
  <circle cx="470" cy="170" r="44" fill="#d8cbb6" opacity="0.16"/>

  <!-- Distant skyline -->
  <g fill="#070605" opacity="0.85">
    <rect x="0" y="600" width="46" height="300"/>
    <rect x="54" y="560" width="30" height="340"/>
    <rect x="92" y="620" width="52" height="280"/>
    <rect x="152" y="540" width="24" height="360"/>
    <rect x="184" y="590" width="40" height="310"/>
    <rect x="232" y="640" width="30" height="260"/>
    <rect x="270" y="520" width="26" height="380"/>
    <rect x="304" y="600" width="44" height="300"/>
    <rect x="356" y="560" width="22" height="340"/>
    <rect x="386" y="630" width="36" height="270"/>
    <rect x="430" y="545" width="28" height="355"/>
    <rect x="466" y="610" width="46" height="290"/>
    <rect x="520" y="555" width="24" height="345"/>
    <rect x="552" y="620" width="48" height="280"/>
  </g>
  <g fill="#e8b45c" opacity="0.5">
    <rect x="60" y="580" width="3" height="4"/>
    <rect x="100" y="640" width="3" height="4"/>
    <rect x="160" y="560" width="3" height="4"/>
    <rect x="192" y="610" width="3" height="4"/>
    <rect x="276" y="540" width="3" height="4"/>
    <rect x="312" y="620" width="3" height="4"/>
    <rect x="360" y="580" width="3" height="4"/>
    <rect x="436" y="565" width="3" height="4"/>
    <rect x="474" y="630" width="3" height="4"/>
    <rect x="526" y="575" width="3" height="4"/>
    <rect x="286" y="600" width="3" height="4"/>
    <rect x="196" y="660" width="3" height="4"/>
    <rect x="444" y="680" width="3" height="4"/>
    <rect x="64" y="700" width="3" height="4"/>
  </g>

  <!-- Rain streaks -->
  <g stroke="#d8cbb6" stroke-width="1" opacity="0.07">
    <line x1="40" y1="0" x2="-30" y2="900"/>
    <line x1="130" y1="0" x2="60" y2="900"/>
    <line x1="220" y1="0" x2="150" y2="900"/>
    <line x1="310" y1="0" x2="240" y2="900"/>
    <line x1="400" y1="0" x2="330" y2="900"/>
    <line x1="490" y1="0" x2="420" y2="900"/>
    <line x1="580" y1="0" x2="510" y2="900"/>
  </g>

  <!-- Blade: vertical, tip down, planted pose -->
  <g>
    <!-- blade steel -->
    <path d="M 300 120 L 312 140 L 312 620 L 300 668 L 288 620 L 288 140 Z" fill="url(#blade)"/>
    <!-- hamon (temper line) -->
    <path d="M 292 150 C 294 260 296 380 294 600 L 300 640 L 306 600 C 305 380 306 260 308 150 Z" fill="#f7f1e4" opacity="0.35"/>
    <!-- edge highlight -->
    <path d="M 300 130 L 305 145 L 305 615 L 300 655 L 295 615 L 295 145 Z" fill="#ffffff" opacity="0.28"/>
    <!-- guard (tsuba) -->
    <rect x="268" y="620" width="64" height="16" rx="6" fill="#171411" stroke="#4a4032" stroke-width="2"/>
    <!-- wrapped hilt -->
    <rect x="284" y="636" width="32" height="150" fill="url(#hiltLeather)"/>
    <!-- hilt wrap diamonds -->
    <g stroke="#2a070b" stroke-width="3" opacity="0.9">
      <line x1="284" y1="656" x2="316" y2="674"/>
      <line x1="316" y1="656" x2="284" y2="674"/>
      <line x1="284" y1="694" x2="316" y2="712"/>
      <line x1="316" y1="694" x2="284" y2="712"/>
      <line x1="284" y1="732" x2="316" y2="750"/>
      <line x1="316" y1="732" x2="284" y2="750"/>
      <line x1="284" y1="770" x2="316" y2="778"/>
      <line x1="316" y1="770" x2="284" y2="778"/>
    </g>
    <!-- pommel -->
    <rect x="288" y="782" width="24" height="12" rx="4" fill="#171411" stroke="#4a4032" stroke-width="2"/>
  </g>

  <!-- Reflection under blade -->
  <ellipse cx="300" cy="820" rx="120" ry="10" fill="#7e1620" opacity="0.25"/>
  <ellipse cx="300" cy="820" rx="60" ry="6" fill="#b3202e" opacity="0.3"/>

  <!-- Title block -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="300" y="112" font-size="17" letter-spacing="10" fill="#b3aa98">MATHAVAN UMA MAGESHWARI</text>
    <text x="300" y="392" font-size="96" font-weight="bold" letter-spacing="14" fill="#ece5d8" opacity="0.97">THE</text>
    <text x="300" y="492" font-size="96" font-weight="bold" letter-spacing="14" fill="#ece5d8" opacity="0.97">LAST</text>
    <text x="300" y="586" font-size="84" font-weight="bold" letter-spacing="18" fill="#d3283a">BLADE</text>
    <line x1="205" y1="620" x2="395" y2="620" stroke="#b3202e" stroke-width="2"/>
    <text x="300" y="655" font-size="17" font-style="italic" fill="#b3aa98">A Cinematic Revenge Thriller</text>
  </g>

  <!-- Bottom strip -->
  <text x="300" y="872" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="6" fill="#7d7566">A  NOVEL</text>
</svg>
