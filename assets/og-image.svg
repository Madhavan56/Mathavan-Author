<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="THE LAST BLADE — a cinematic revenge thriller by Mathavan Uma Mageshwari">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14110e"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#7e1620" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede0"/>
      <stop offset="0.5" stop-color="#a99d85"/>
      <stop offset="1" stop-color="#2e2a22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle rain -->
  <g stroke="#d8cbb6" stroke-width="1" opacity="0.06">
    <line x1="100" y1="0" x2="20" y2="630"/>
    <line x1="300" y1="0" x2="220" y2="630"/>
    <line x1="500" y1="0" x2="420" y2="630"/>
    <line x1="700" y1="0" x2="620" y2="630"/>
    <line x1="900" y1="0" x2="820" y2="630"/>
    <line x1="1100" y1="0" x2="1020" y2="630"/>
  </g>

  <!-- small skyline silhouette -->
  <g fill="#060504" opacity="0.7">
    <rect x="0" y="470" width="70" height="160"/>
    <rect x="80" y="420" width="50" height="210"/>
    <rect x="140" y="500" width="80" height="130"/>
    <rect x="960" y="450" width="60" height="180"/>
    <rect x="1030" y="500" width="90" height="130"/>
    <rect x="1130" y="430" width="70" height="200"/>
  </g>

  <!-- blade motif, right side -->
  <g transform="translate(950 315) rotate(18)">
    <path d="M 0 -220 L 14 -195 L 14 180 L 0 228 L -14 180 L -14 -195 Z" fill="url(#blade)" opacity="0.9"/>
    <rect x="-30" y="180" width="60" height="13" rx="5" fill="#171411" stroke="#4a4032" stroke-width="2"/>
    <rect x="-15" y="193" width="30" height="70" fill="#8f1a26"/>
    <line x1="-15" y1="210" x2="15" y2="224" stroke="#2a070b" stroke-width="3"/>
    <line x1="15" y1="210" x2="-15" y2="224" stroke="#2a070b" stroke-width="3"/>
    <line x1="-15" y1="238" x2="15" y2="250" stroke="#2a070b" stroke-width="3"/>
    <line x1="15" y1="238" x2="-15" y2="250" stroke="#2a070b" stroke-width="3"/>
  </g>

  <!-- text block -->
  <g text-anchor="start">
    <text x="90" y="200" font-family="Georgia, serif" font-size="22" letter-spacing="8" fill="#b3aa98">MATHAVAN UMA MAGESHWARI</text>
    <text x="90" y="310" font-family="Georgia, serif" font-size="110" font-weight="bold" letter-spacing="10" fill="#ece5d8">THE LAST</text>
    <text x="90" y="430" font-family="Georgia, serif" font-size="110" font-weight="bold" letter-spacing="10" fill="#d3283a">BLADE</text>
    <text x="92" y="500" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#b3aa98">A Cinematic Revenge Thriller of Family, Secrets, and Survival</text>
    <text x="92" y="570" font-family="Arial, sans-serif" font-size="16" letter-spacing="4" fill="#7d7566">OFFICIAL AUTHOR WEBSITE  ·  2026</text>
  </g>
</svg>
