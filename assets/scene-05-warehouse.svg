<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0d0b"/>
      <stop offset="0.6" stop-color="#15120e"/>
      <stop offset="1" stop-color="#090807"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e8dcc0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e8dcc0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a08" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0a08" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wh)"/>
  <!-- high windows casting light shafts -->
  <g fill="#060505">
    <rect x="120" y="0" width="120" height="150"/>
    <rect x="330" y="0" width="120" height="150"/>
    <rect x="1150" y="0" width="120" height="150"/>
    <rect x="1360" y="0" width="120" height="150"/>
  </g>
  <g>
    <path d="M150 150 L300 150 L560 860 L260 860 Z" fill="url(#shaft)"/>
    <path d="M1180 150 L1330 150 L1380 860 L1080 860 Z" fill="url(#shaft)" opacity="0.7"/>
  </g>
  <!-- steel pillars and catwalk -->
  <g fill="#0a0908">
    <rect x="220" y="120" width="26" height="700"/>
    <rect x="560" y="180" width="22" height="640"/>
    <rect x="1010" y="180" width="22" height="640"/>
    <rect x="1350" y="120" width="26" height="700"/>
    <rect x="220" y="240" width="1160" height="14"/>
    <rect x="220" y="254" width="1160" height="6" fill="#12100d"/>
  </g>
  <!-- stacked crates -->
  <g fill="#0c0a09">
    <rect x="90" y="560" width="180" height="240"/>
    <rect x="120" y="470" width="150" height="100"/>
    <rect x="1330" y="590" width="200" height="210"/>
    <rect x="1380" y="500" width="150" height="100"/>
  </g>
  <g stroke="#15120e" stroke-width="4">
    <line x1="90" y1="620" x2="270" y2="620"/>
    <line x1="1330" y1="650" x2="1530" y2="650"/>
  </g>
  <!-- hanging industrial lamps -->
  <g>
    <line x1="700" y1="0" x2="700" y2="180" stroke="#0a0908" stroke-width="4"/>
    <path d="M664 206 L736 206 L716 180 L684 180 Z" fill="#0d0c0a"/>
    <ellipse cx="700" cy="230" rx="200" ry="46" fill="#e8dcc0" opacity="0.09"/>
    <line x1="1000" y1="0" x2="1000" y2="150" stroke="#0a0908" stroke-width="4"/>
    <path d="M968 172 L1032 172 L1014 150 L986 150 Z" fill="#0d0c0a"/>
    <ellipse cx="1000" cy="196" rx="150" ry="36" fill="#e8dcc0" opacity="0.07"/>
  </g>
  <!-- concrete floor -->
  <rect y="720" width="1600" height="180" fill="#0b0a08"/>
  <rect y="720" width="1600" height="180" fill="url(#floorfade)"/>
  <!-- opponent one: mid-swing shadow -->
  <g fill="#060505">
    <circle cx="620" cy="420" r="20"/>
    <path d="M596 444 Q620 436 644 444 L652 560 L588 560 Z"/>
    <rect x="598" y="556" width="16" height="80"/>
    <rect x="628" y="556" width="16" height="80"/>
    <!-- his arm + pipe raised -->
    <path d="M644 452 L690 420 L716 384" stroke="#060505" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="716" y1="384" x2="756" y2="330" stroke="#060505" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- opponent two: lunging low -->
  <g fill="#070606">
    <circle cx="1050" cy="500" r="18"/>
    <path d="M1028 520 Q1050 513 1072 520 L1078 610 L1022 610 Z"/>
    <rect x="1026" y="606" width="15" height="76"/>
    <rect x="1058" y="606" width="15" height="76"/>
    <path d="M1070 528 L1114 512 L1142 522" stroke="#070606" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Lucy center: low sword stance, backlit -->
  <g fill="#030303">
    <circle cx="836" cy="452" r="19"/>
    <path d="M812 474 Q836 466 860 474 L868 580 L804 580 Z"/>
    <rect x="812" y="576" width="15" height="86"/>
    <rect x="845" y="576" width="15" height="86"/>
    <!-- extended lead arm gripping the blade -->
    <path d="M858 486 L916 462 L946 470" stroke="#030303" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- the blade catching the light -->
  <line x1="946" y1="470" x2="1082" y2="418" stroke="#e8dcc0" stroke-width="5" stroke-linecap="round"/>
  <line x1="946" y1="470" x2="1082" y2="418" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <ellipse cx="1010" cy="446" rx="26" ry="7" fill="#e8dcc0" opacity="0.25" transform="rotate(-20 1010 446)"/>
  <!-- motion streaks frozen mid-action -->
  <g stroke="#2a251d" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <line x1="880" y1="470" x2="960" y2="438"/>
    <line x1="884" y1="494" x2="956" y2="466"/>
    <line x1="640" y1="430" x2="700" y2="404"/>
    <line x1="1040" y1="530" x2="1100" y2="508"/>
  </g>
  <!-- dust motes in the shafts -->
  <g fill="#e8dcc0" opacity="0.35">
    <circle cx="360" cy="330" r="2"/>
    <circle cx="420" cy="450" r="1.6"/>
    <circle cx="300" cy="520" r="1.8"/>
    <circle cx="1250" cy="380" r="2"/>
    <circle cx="1200" cy="500" r="1.5"/>
    <circle cx="1310" cy="560" r="1.7"/>
  </g>
  <rect width="1600" height="900" fill="#0c0b0a" opacity="0.12"/>
</svg>
