<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dojo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c140d"/>
      <stop offset="0.6" stop-color="#241a11"/>
      <stop offset="1" stop-color="#120c08"/>
    </linearGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#d99a4e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d99a4e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#dojo)"/>
  <!-- wooden beams and shoji screens -->
  <g fill="#150e09">
    <rect x="0" y="0" width="1600" height="90"/>
    <rect x="140" y="90" width="26" height="560"/>
    <rect x="520" y="90" width="26" height="560"/>
    <rect x="1054" y="90" width="26" height="560"/>
    <rect x="1434" y="90" width="26" height="560"/>
  </g>
  <!-- shoji panels glowing softly -->
  <g fill="#2e2115">
    <rect x="200" y="140" width="280" height="420"/>
    <rect x="580" y="140" width="280" height="420"/>
    <rect x="1120" y="140" width="280" height="420"/>
  </g>
  <g stroke="#4a3826" stroke-width="3" opacity="0.8">
    <line x1="340" y1="140" x2="340" y2="560"/>
    <line x1="200" y1="280" x2="480" y2="280"/>
    <line x1="200" y1="420" x2="480" y2="420"/>
    <line x1="720" y1="140" x2="720" y2="560"/>
    <line x1="580" y1="280" x2="860" y2="280"/>
    <line x1="580" y1="420" x2="860" y2="420"/>
    <line x1="1260" y1="140" x2="1260" y2="560"/>
    <line x1="1120" y1="280" x2="1400" y2="280"/>
    <line x1="1120" y1="420" x2="1400" y2="420"/>
  </g>
  <!-- hanging lantern -->
  <line x1="800" y1="90" x2="800" y2="200" stroke="#150e09" stroke-width="5"/>
  <ellipse cx="800" cy="250" rx="46" ry="60" fill="#e8a353"/>
  <ellipse cx="800" cy="250" rx="46" ry="60" fill="url(#lantern)" opacity="0.6"/>
  <rect x="788" y="186" width="24" height="10" rx="3" fill="#150e09"/>
  <rect x="788" y="306" width="24" height="10" rx="3" fill="#150e09"/>
  <ellipse cx="800" cy="420" rx="330" ry="180" fill="url(#lantern)"/>
  <!-- tatami floor -->
  <rect y="650" width="1600" height="250" fill="#191009"/>
  <g stroke="#241710" stroke-width="4">
    <line x1="0" y1="710" x2="1600" y2="710"/>
    <line x1="0" y1="780" x2="1600" y2="780"/>
    <line x1="400" y1="650" x2="400" y2="900"/>
    <line x1="800" y1="650" x2="800" y2="900"/>
    <line x1="1200" y1="650" x2="1200" y2="900"/>
  </g>
  <!-- grandfather figure seated, observing -->
  <g fill="#0c0805">
    <circle cx="1030" cy="500" r="20"/>
    <path d="M1004 524 Q1030 515 1056 524 L1064 640 L996 640 Z"/>
    <!-- folded legs -->
    <path d="M996 636 Q1030 660 1064 636 L1064 652 L996 652 Z"/>
    <!-- resting hands -->
    <path d="M1008 560 L988 592 M1052 560 L1072 592" stroke="#0c0805" stroke-width="11" stroke-linecap="round"/>
  </g>
  <!-- the traditional blade resting inside its wooden box -->
  <g>
    <rect x="560" y="600" width="300" height="52" rx="6" fill="#241708"/>
    <rect x="566" y="606" width="288" height="40" rx="4" fill="#2e1d0a"/>
    <!-- blade glinting inside -->
    <path d="M590 626 L830 626" stroke="#d8c9a8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M590 626 L830 626" stroke="#fff7e0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <rect x="830" y="618" width="26" height="16" rx="3" fill="#151009"/>
  </g>
  <!-- symbolic childhood memory: small figure reaching toward the box -->
  <g fill="#0d0906">
    <circle cx="470" cy="560" r="13"/>
    <path d="M454 576 Q470 570 486 576 L492 646 L448 646 Z"/>
    <path d="M486 588 L520 610" stroke="#0d0906" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- warm motes in the lantern light -->
  <g fill="#ffd9a0" opacity="0.4">
    <circle cx="740" cy="330" r="2"/>
    <circle cx="860" cy="360" r="1.6"/>
    <circle cx="800" cy="470" r="1.8"/>
    <circle cx="900" cy="520" r="1.5"/>
  </g>
  <rect width="1600" height="900" fill="#0c0b0a" opacity="0.14"/>
</svg>
