<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a251d"/>
      <stop offset="0.45" stop-color="#3a3226"/>
      <stop offset="1" stop-color="#17130e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#ffe4b0" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#d9b478" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d9b478" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#dawn)"/>
  <!-- soft morning window light -->
  <rect x="240" y="90" width="440" height="560" fill="#4a4030"/>
  <rect x="260" y="110" width="400" height="520" fill="#6b5c42"/>
  <g stroke="#2a251d" stroke-width="10">
    <line x1="460" y1="110" x2="460" y2="630"/>
    <line x1="260" y1="370" x2="660" y2="370"/>
  </g>
  <ellipse cx="480" cy="380" rx="430" ry="330" fill="url(#sun)"/>
  <!-- light falling across a plain wooden table -->
  <path d="M700 900 L980 560 L1600 620 L1600 900 Z" fill="#221a12"/>
  <path d="M700 900 L980 560 L1600 620 L1600 900 Z" fill="url(#sun)" opacity="0.5"/>
  <!-- the wooden box, lid half open -->
  <g>
    <!-- base -->
    <rect x="950" y="600" width="420" height="120" rx="8" fill="#332616"/>
    <rect x="950" y="600" width="420" height="120" rx="8" fill="url(#sun)" opacity="0.35"/>
    <!-- inner felt -->
    <rect x="966" y="612" width="388" height="30" rx="4" fill="#1c1410"/>
    <!-- blade resting inside, catching morning light -->
    <path d="M1000 624 L1290 624" stroke="#d8c9a8" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
    <path d="M1000 624 L1290 624" stroke="#fff7e0" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
    <rect x="1290" y="615" width="30" height="18" rx="4" fill="#191209"/>
    <!-- lid, angled open on hinge -->
    <path d="M950 600 L1370 600 L1420 470 L1000 470 Z" fill="#3c2d1a"/>
    <path d="M1000 470 L1420 470 L1436 430 L1016 430 Z" fill="#2a2013"/>
  </g>
  <!-- her hand gently starting to close the lid -->
  <g fill="#191209">
    <path d="M1330 420 Q1360 400 1392 408 L1400 436 L1338 442 Z"/>
    <path d="M1348 442 L1360 470 L1380 468 L1372 440 Z"/>
  </g>
  <!-- dust motes floating in the warm light -->
  <g fill="#ffe4b0" opacity="0.5">
    <circle cx="560" cy="300" r="2.2"/>
    <circle cx="640" cy="420" r="1.8"/>
    <circle cx="500" cy="520" r="1.6"/>
    <circle cx="720" cy="250" r="1.9"/>
    <circle cx="840" cy="480" r="1.6"/>
  </g>
  <!-- a plant on the windowsill: life going on -->
  <g fill="#241f14">
    <rect x="120" y="560" width="70" height="90" rx="6"/>
    <path d="M155 560 Q120 500 100 470 Q140 490 158 540 Z"/>
    <path d="M155 560 Q190 490 214 470 Q196 510 162 545 Z"/>
  </g>
  <rect width="1600" height="900" fill="#0c0b0a" opacity="0.1"/>
</svg>
