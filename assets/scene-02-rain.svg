<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.6" stop-color="#10131a"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#c9d6e8" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="#8fa3bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8fa3bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#night)"/>
  <!-- building shadows lining the street -->
  <g fill="#0a0c10">
    <rect x="0" y="80" width="420" height="560"/>
    <rect x="1180" y="120" width="420" height="520"/>
    <rect x="420" y="220" width="180" height="420"/>
    <rect x="1000" y="240" width="180" height="400"/>
  </g>
  <!-- sparse lit windows -->
  <g fill="#5d6d85" opacity="0.35">
    <rect x="60" y="180" width="26" height="40" rx="2"/>
    <rect x="150" y="300" width="26" height="40" rx="2"/>
    <rect x="300" y="240" width="26" height="40" rx="2"/>
    <rect x="1260" y="220" width="26" height="40" rx="2"/>
    <rect x="1400" y="330" width="26" height="40" rx="2"/>
  </g>
  <!-- the street lamp over Lucy -->
  <rect x="782" y="60" width="8" height="220" fill="#0c0e12"/>
  <path d="M786 280 Q800 300 824 302 L824 310 L780 310 L780 282 Z" fill="#0c0e12"/>
  <ellipse cx="800" cy="318" rx="120" ry="34" fill="url(#lampGlow)"/>
  <circle cx="800" cy="308" r="9" fill="#dce8f8"/>
  <!-- light cone -->
  <path d="M770 316 L830 316 L920 620 L680 620 Z" fill="#c9d6e8" opacity="0.07"/>
  <!-- wet road -->
  <rect y="620" width="1600" height="280" fill="url(#wet)"/>
  <!-- Lucy beneath the light, back view -->
  <g fill="#050607">
    <circle cx="800" cy="470" r="16"/>
    <path d="M782 488 Q800 482 818 488 L824 560 L776 560 Z"/>
    <rect x="784" y="556" width="13" height="52"/>
    <rect x="804" y="556" width="13" height="52"/>
  </g>
  <ellipse cx="800" cy="640" rx="60" ry="12" fill="#0a0d13"/>
  <!-- her reflection on wet pavement -->
  <g fill="#1a2432" opacity="0.4">
    <path d="M784 660 Q800 666 816 660 L820 716 L780 716 Z"/>
    <circle cx="800" cy="648" r="12" opacity="0.5"/>
  </g>
  <!-- the watcher: distant silhouette half-hidden at alley edge -->
  <g fill="#040506">
    <circle cx="1136" cy="500" r="11"/>
    <path d="M1122 513 Q1136 508 1150 513 L1155 580 L1118 580 Z"/>
  </g>
  <ellipse cx="1136" cy="600" rx="42" ry="9" fill="#0a0d13" opacity="0.7"/>
  <!-- faint reflection of the watcher -->
  <ellipse cx="1136" cy="640" rx="30" ry="8" fill="#131a26" opacity="0.5"/>
  <!-- rain streaks -->
  <g stroke="#aebcd2" stroke-width="1.4" opacity="0.16">
    <line x1="140" y1="60" x2="110" y2="150"/>
    <line x1="360" y1="120" x2="330" y2="220"/>
    <line x1="540" y1="40" x2="512" y2="130"/>
    <line x1="700" y1="160" x2="672" y2="260"/>
    <line x1="920" y1="70" x2="892" y2="170"/>
    <line x1="1080" y1="140" x2="1052" y2="240"/>
    <line x1="1240" y1="50" x2="1212" y2="150"/>
    <line x1="1430" y1="120" x2="1402" y2="220"/>
    <line x1="1520" y1="260" x2="1492" y2="360"/>
    <line x1="240" y1="360" x2="212" y2="460"/>
    <line x1="470" y1="380" x2="442" y2="480"/>
    <line x1="980" y1="330" x2="952" y2="430"/>
  </g>
  <rect width="1600" height="900" fill="#0c0b0a" opacity="0.22"/>
</svg>
